name: Build Windows EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "GuiNguoiToThuong" hi.py

      - name: Lưu file EXE
        uses: actions/upload-artifact@v4
        with:
          name: GuiNguoiToThuong-Windows
          path: dist/GuiNguoiToThuong.exe
